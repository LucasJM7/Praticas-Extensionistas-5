<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrecheNow - Painel Pais</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2a66b4">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">CRECHENOW</a>
      <div class="d-flex align-items-center">
        <span class="text-white me-3 d-none d-sm-inline" id="userNameDisplay">Responsável</span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-4">
      
      <!-- COLUNA 1: AGENDA (Esquerda) -->
      <div class="col-lg-3">
        <div class="card shadow-sm border-0 h-100 d-flex flex-column">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0 fs-6">📅 Agenda Semanal</h5>
          </div>
          <div class="card-body p-2 flex-grow-1 overflow-auto" style="max-height: 600px;">
            <div id="agenda-list"></div>
          </div>
        </div>
      </div>

      <!-- COLUNA 2: COMUNICADOS E ROTINA (Centro) -->
      <div class="col-lg-6">
        <!-- Comunicados em Carrossel -->
        <div class="card shadow-sm border-0 mb-4">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fs-6">📢 Comunicados</h5>
            <div class="btn-group btn-group-sm">
              <button type="button" class="btn btn-outline-primary active" data-filter="all">Todos</button>
              <button type="button" class="btn btn-outline-primary" data-filter="saude">Saúde</button>
              <button type="button" class="btn btn-outline-primary" data-filter="pedagogico">Pedagógico</button>
            </div>
          </div>
          <div class="card-body p-0">
            <div id="notifications-carousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
              <div class="carousel-inner" id="carousel-inner-notifs">
                <!-- Inserido via JS -->
              </div>
              <button class="carousel-control-prev" type="button" data-bs-target="#notifications-carousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon bg-dark rounded-circle p-2" aria-hidden="true"></span>
              </button>
              <button class="carousel-control-next" type="button" data-bs-target="#notifications-carousel" data-bs-slide="next">
                <span class="carousel-control-next-icon bg-dark rounded-circle p-2" aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </div>

        <!-- Rotina Diária da Criança -->
        <div class="card shadow-sm border-0">
          <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fs-6">👶 Rotina de Hoje</h5>
            <button class="btn btn-sm btn-light text-success fw-bold" id="toggleRoutineHistory">Ver Histórico</button>
          </div>
          <div class="card-body">
            <div id="routine-today"></div>
            <div id="routine-history" class="d-none mt-3 border-top pt-3"></div>
          </div>
        </div>

        <!-- Formulário de Recado -->
        <div class="card shadow-sm border-0 mt-4">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0 fs-6">✉️ Enviar Recado para a Creche</h5>
          </div>
          <div class="card-body">
            <form id="parentMsgForm" class="needs-validation" novalidate>
              <div class="mb-3">
                <label for="childName" class="form-label small fw-bold">Nome da Criança</label>
                <input type="text" class="form-control" id="childName" required placeholder="Ex: Joãozinho Silva">
              </div>
              <div class="mb-3">
                <label for="parentMessage" class="form-label small fw-bold">Mensagem</label>
                <textarea class="form-control" id="parentMessage" rows="2" required placeholder="Ex: Hoje o João vai chegar 30 min mais tarde."></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-100 btn-sm">Enviar Recado</button>
            </form>
          </div>
        </div>
      </div>

      <!-- COLUNA 3: CARDÁPIO (Direita) -->
      <div class="col-lg-3">
        <div class="card shadow-sm border-0 h-100 d-flex flex-column">
          <div class="card-header bg-success text-white">
            <h5 class="mb-0 fs-6">🍽️ Cardápio Semanal</h5>
          </div>
          <div class="card-body p-2 flex-grow-1 overflow-auto" style="max-height: 600px;">
            <div id="cardapio-list"></div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
