<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrecheNow - Painel Pais</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2a66b4">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">CRECHENOW</a>
      <div class="d-flex align-items-center">
        <span class="text-white me-3 d-none d-sm-inline">Responsável</span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-4">
      <!-- Coluna da Esquerda: Comunicados e Recados -->
      <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="mb-0"> Comunicados</h4>
          <div class="btn-group btn-group-sm" role="group">
            <button type="button" class="btn btn-outline-primary active" data-filter="all">Todos</button>
            <button type="button" class="btn btn-outline-primary" data-filter="saude">Saúde</button>
            <button type="button" class="btn btn-outline-primary" data-filter="pedagogico">Pedagógico</button>
          </div>
        </div>
        <div id="notifications-feed" class="mb-4"></div>

        <!-- Formulário de Recado para a Creche -->
        <div class="card shadow-sm border-0">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0">✉️ Enviar Recado para a Creche</h5>
          </div>
          <div class="card-body">
            <form id="parentMsgForm" class="needs-validation" novalidate>
              <div class="mb-3">
                <label for="childName" class="form-label">Nome da Criança</label>
                <input type="text" class="form-control" id="childName" required placeholder="Ex: Joãozinho Silva">
                <div class="invalid-feedback">Informe o nome da criança.</div>
              </div>
              <div class="mb-3">
                <label for="parentMessage" class="form-label">Mensagem</label>
                <textarea class="form-control" id="parentMessage" rows="3" required placeholder="Ex: Hoje o João vai chegar 30 min mais tarde."></textarea>
                <div class="invalid-feedback">Escreva uma mensagem.</div>
              </div>
              <button type="submit" class="btn btn-primary w-100">Enviar Recado</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Coluna da Direita: Agenda e Cardápio (Abas) -->
      <div class="col-lg-4">
        <div class="card shadow-sm border-0 bg-light h-100">
          <div class="card-header bg-white border-bottom-0 pt-2 pb-0">
            <ul class="nav nav-tabs card-header-tabs" id="parentTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active py-1 px-2 small" id="agenda-tab" data-bs-toggle="tab" data-bs-target="#agenda-pane" type="button" role="tab"> Agenda</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link py-1 px-2 small" id="cardapio-tab" data-bs-toggle="tab" data-bs-target="#cardapio-pane" type="button" role="tab">️ Cardápio</button>
              </li>
            </ul>
          </div>
          <div class="card-body pt-2 p-2" style="max-height: 450px; overflow-y: auto;">
            <div class="tab-content" id="parentTabsContent">
              <div class="tab-pane fade show active" id="agenda-pane" role="tabpanel">
                <div id="agenda-list"></div>
              </div>
              <div class="tab-pane fade" id="cardapio-pane" role="tabpanel">
                <div id="cardapio-list"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
