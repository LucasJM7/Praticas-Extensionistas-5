<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrecheNow - Secretaria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2a66b4">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="#">CRECHENOW</a>
      <div class="d-flex align-items-center">
        <span class="text-white me-3 d-none d-sm-inline">Secretaria</span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <main class="dashboard-main">
    <div class="dashboard-row">
      
      <div class="side-column">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-dark text-white py-2">
            <h5 class="mb-0 fs-6">📢 Novo Comunicado</h5>
          </div>
          <div class="card-body">
            <form id="staffForm" class="needs-validation h-100 d-flex flex-column" novalidate>
              <div class="mb-3">
                <label class="form-label small fw-bold">Tipo</label>
                <select class="form-select" id="notifyType" required>
                  <option value="geral">Geral</option>
                  <option value="saude">Saúde</option>
                  <option value="pedagogico">Pedagógico</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-bold">Público</label>
                <select class="form-select" id="notifyTarget" required>
                  <option value="all">Todas as turmas</option>
                  <option value="A">Turma A</option>
                  <option value="B">Turma B</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-bold">Título</label>
                <input type="text" class="form-control" id="notifyTitle" required>
              </div>
              <div class="mb-3 flex-grow-1">
                <label class="form-label small fw-bold">Mensagem</label>
                <textarea class="form-control h-100" id="notifyBody" required></textarea>
              </div>
              <button type="submit" class="btn btn-dark w-100">Enviar Comunicado</button>
            </form>
          </div>
        </div>
      </div>

      <div class="center-column">
        <div class="card shadow-sm border-0" style="flex: 1; min-height: 0;">
          <div class="card-header bg-white py-2">
            <h5 class="mb-0 fs-6">📋 Histórico de Envios</h5>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive h-100">
              <table class="table table-hover mb-0 align-middle">
                <thead class="table-light sticky-top">
                  <tr>
                    <th>Assunto</th>
                    <th>Tipo</th>
                    <th>Data</th>
                  </tr>
                </thead>
                <tbody id="sent-notifications"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-primary flex-fill" id="openAgendaEditorBtn">📅 Editar Agenda</button>
          <button class="btn btn-success flex-fill" id="openCardapioEditorBtn">🍽️ Editar Cardápio</button>
        </div>
      </div>

      <div class="side-column">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-primary text-white py-2 d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fs-6">👥 Alunos</h5>
            <button class="btn btn-sm btn-light" id="openAddStudentBtn">+ Adicionar</button>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive h-100">
              <table class="table table-hover mb-0 align-middle">
                <thead class="table-light sticky-top">
                  <tr>
                    <th>Nome</th>
                    <th>Turma</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody id="students-list"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <div class="modal-overlay" id="addStudentModal">
    <div class="modal-box">
      <button class="modal-close" data-close="addStudentModal">&times;</button>
      <h4 class="mb-3"> Cadastrar Novo Aluno</h4>
      <form id="addStudentForm">
        <div class="mb-3">
          <label class="form-label fw-bold">Nome Completo</label>
          <input type="text" class="form-control" id="newStudentName" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Turma</label>
          <select class="form-select" id="newStudentClass" required>
            <option value="A">Turma A</option>
            <option value="B">Turma B</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">E-mail do Responsável</label>
          <input type="email" class="form-control" id="newStudentParentEmail" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="parentMsgsModal">
    <div class="modal-box">
      <button class="modal-close" data-close="parentMsgsModal">&times;</button>
      <h4 class="mb-3">📬 Recados dos Responsáveis</h4>
      <div id="parent-messages-list" style="max-height: 500px; overflow-y: auto;"></div>
    </div>
  </div>

  <div class="modal-overlay" id="agendaEditorModal">
    <div class="modal-box">
      <button class="modal-close" data-close="agendaEditorModal">&times;</button>
      <h4 class="mb-3"> Editar Agenda Semanal</h4>
      <form id="agendaEditorForm">
        <div id="agendaEditorContainer"></div>
        <button type="button" class="btn btn-outline-primary btn-sm mb-3" id="addAgendaItemBtn">+ Adicionar Item</button>
        <button type="submit" class="btn btn-primary w-100">💾 Salvar Agenda</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="cardapioEditorModal">
    <div class="modal-box">
      <button class="modal-close" data-close="cardapioEditorModal">&times;</button>
      <h4 class="mb-3">🍽️ Editar Cardápio Semanal</h4>
      <form id="cardapioEditorForm">
        <div id="cardapioEditorContainer"></div>
        <button type="button" class="btn btn-outline-success btn-sm mb-3" id="addCardapioItemBtn">+ Adicionar Item</button>
        <button type="submit" class="btn btn-success w-100">💾 Salvar Cardápio</button>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
