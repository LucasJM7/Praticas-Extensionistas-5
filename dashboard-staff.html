<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrecheNow - Secretaria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2a66b4">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">CRECHENOW</a>
      <div class="d-flex align-items-center">
        <span class="text-white me-3 d-none d-sm-inline">Secretaria</span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <ul class="nav nav-tabs mb-4" id="staffTabs">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-comunicados">Comunicados</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-alunos">Gerenciar Alunos</button></li>
    </ul>

    <div class="tab-content">
      <!-- ABA COMUNICADOS -->
      <div class="tab-pane fade show active" id="tab-comunicados">
        <div class="card shadow-sm border-0 mb-4">
          <div class="card-header bg-dark text-white">
            <h5 class="mb-0">📢 Novo Comunicado</h5>
          </div>
          <div class="card-body">
            <form id="staffForm" class="needs-validation" novalidate>
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label">Tipo</label>
                  <select class="form-select" id="notifyType" required>
                    <option value="geral">Geral</option>
                    <option value="saude">Saúde</option>
                    <option value="pedagogico">Pedagógico</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Público</label>
                  <select class="form-select" id="notifyTarget" required>
                    <option value="all">Todas as turmas</option>
                    <option value="A">Turma A</option>
                    <option value="B">Turma B</option>
                  </select>
                </div>
                <div class="col-md-12">
                  <label class="form-label">Título</label>
                  <input type="text" class="form-control" id="notifyTitle" required>
                </div>
                <div class="col-md-12">
                  <label class="form-label">Mensagem</label>
                  <textarea class="form-control" id="notifyBody" rows="3" required></textarea>
                </div>
                <div class="col-12 text-end">
                  <button type="submit" class="btn btn-dark px-4">Enviar Comunicado</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- ABA GERENCIAR ALUNOS -->
      <div class="tab-pane fade" id="tab-alunos">
        <div class="row g-4">
          <div class="col-md-4">
            <div class="card shadow-sm border-0">
              <div class="card-header bg-primary text-white">
                <h5 class="mb-0">➕ Adicionar Aluno</h5>
              </div>
              <div class="card-body">
                <form id="addStudentForm">
                  <div class="mb-3">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" id="newStudentName" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Turma</label>
                    <select class="form-select" id="newStudentClass" required>
                      <option value="A">Turma A</option>
                      <option value="B">Turma B</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">E-mail do Responsável</label>
                    <input type="email" class="form-control" id="newStudentParentEmail" required>
                  </div>
                  <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                </form>
              </div>
            </div>
          </div>
          <div class="col-md-8">
            <div class="card shadow-sm border-0">
              <div class="card-header bg-white">
                <h5 class="mb-0">👥 Alunos Matriculados</h5>
              </div>
              <div class="card-body p-0">
                <div class="table-responsive">
                  <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                      <tr>
                        <th>Nome</th>
                        <th>Turma</th>
                        <th>Responsável</th>
                        <th>Ações</th>
                      </tr>
                    </thead>
                    <tbody id="students-list"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
