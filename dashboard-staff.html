<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrecheNow - Painel Creche</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2a66b4">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">CRECHENOW</a>
      <div class="d-flex align-items-center">
        <span class="text-white me-3 d-none d-sm-inline">Funcionário</span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <!-- Formulário de Novo Comunicado -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-header bg-success text-white">
        <h5 class="mb-0"> Novo Comunicado</h5>
      </div>
      <div class="card-body">
        <form id="staffForm" class="needs-validation" novalidate>
          <div class="row g-3">
            <div class="col-md-4">
              <label for="notifyType" class="form-label">Tipo</label>
              <select class="form-select" id="notifyType" required>
                <option value="geral">Geral</option>
                <option value="saude">Saúde</option>
                <option value="pedagogico">Pedagógico</option>
                <option value="reuniao">Reunião</option>
              </select>
            </div>
            <div class="col-md-4">
              <label for="notifyTarget" class="form-label">Público</label>
              <select class="form-select" id="notifyTarget" required>
                <option value="all">Todas as turmas</option>
                <option value="A">Turma A</option>
                <option value="B">Turma B</option>
              </select>
            </div>
            <div class="col-md-12">
              <label for="notifyTitle" class="form-label">Título</label>
              <input type="text" class="form-control" id="notifyTitle" required>
            </div>
            <div class="col-md-12">
              <label for="notifyBody" class="form-label">Mensagem</label>
              <textarea class="form-control" id="notifyBody" rows="3" required></textarea>
            </div>
            <div class="col-12 text-end">
              <button type="submit" class="btn btn-success px-4">Enviar Comunicado</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="row g-4">
      <!-- Histórico de Envios -->
      <div class="col-lg-7">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-header bg-white">
            <h5 class="mb-0">📋 Histórico de Envios</h5>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Assunto</th>
                    <th>Tipo</th>
                    <th>Lidos</th>
                    <th>Data</th>
                  </tr>
                </thead>
                <tbody id="sent-notifications">
                  <!-- Preenchido via JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Recados dos Pais -->
      <div class="col-lg-5">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
            <h5 class="mb-0">📬 Recados dos Responsáveis</h5>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                  <tr>
                    <th>De</th>
                    <th>Mensagem</th>
                    <th class="text-center">Ação</th>
                  </tr>
                </thead>
                <tbody id="parent-messages-list">
                  <!-- Preenchido via JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
