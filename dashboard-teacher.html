<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrecheNow - Painel Professor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2a66b4">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-info shadow-sm">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="#">CRECHENOW</a>
      <div class="d-flex align-items-center">
        <span class="text-white me-3 d-none d-sm-inline" id="teacherInfo">Professor</span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <main class="dashboard-main">
    <div class="dashboard-row">
      
      <div class="side-column">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white py-2">
            <h5 class="mb-0 fs-6"> Minha Turma <span id="teacherClassDisplay" class="badge bg-info text-dark"></span></h5>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive h-100">
              <table class="table table-hover mb-0 align-middle">
                <thead class="table-light sticky-top">
                  <tr><th>Nome</th><th>Hoje</th></tr>
                </thead>
                <tbody id="teacher-students-list"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div class="center-column">
        
        <div class="card shadow-sm border-0" style="flex: 1; min-height: 0;">
          <div class="card-header bg-info text-white py-2">
            <h5 class="mb-0 fs-6"> Registro de Rotina Diária</h5>
          </div>
          <div class="card-body">
            <form id="teacherRoutineForm" class="needs-validation h-100 d-flex flex-column" novalidate>
              <div class="mb-3">
                <label class="form-label small fw-bold">Aluno</label>
                <select class="form-select" id="routineStudentSelect" required>
                  <option value="">Escolha um aluno...</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold d-block mb-1">Presença</label>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="routineAttendance" checked>
                  <label class="form-check-label small" for="routineAttendance">Presente hoje</label>
                </div>
              </div>

              <div id="routineQuestionsContainer" class="mb-3 flex-grow-1">
                <label class="form-label small fw-bold">Avaliação do Dia</label>
                <div class="table-responsive">
                  <table class="table table-sm align-middle mb-0">
                    <tbody>
                      <tr><td class="small">Se comportou bem?</td><td><input type="radio" name="q1" value="sim" required> Sim <input type="radio" name="q1" value="nao"> Não</td></tr>
                      <tr><td class="small">Prestou atenção?</td><td><input type="radio" name="q2" value="sim" required> Sim <input type="radio" name="q2" value="nao"> Não</td></tr>
                      <tr><td class="small">Fez os deveres?</td><td><input type="radio" name="q3" value="sim" required> Sim <input type="radio" name="q3" value="nao"> Não</td></tr>
                      <tr><td class="small">Se deu bem com colegas?</td><td><input type="radio" name="q4" value="sim" required> Sim <input type="radio" name="q4" value="nao"> Não</td></tr>
                      <tr><td class="small">Comeu toda a comida?</td><td><input type="radio" name="q5" value="sim" required> Sim <input type="radio" name="q5" value="nao"> Não</td></tr>
                    </tbody>
                  </table>
                </div>
                <div class="mt-3">
                  <label class="form-label small fw-bold">Comentários (Opcional)</label>
                  <textarea class="form-control" id="routineComment" rows="2" placeholder="Detalhes sobre o dia..."></textarea>
                </div>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-info text-white flex-fill">💾 Salvar Rotina</button>
              </div>
            </form>
          </div>
        </div>

        <div class="d-flex gap-2 justify-content-center" style="flex-shrink: 0;">
          <button class="btn btn-primary d-flex align-items-center gap-2" id="openTeacherMsgModalBtn">
            <span>✉️</span> Enviar Recado
          </button>
          <button class="btn btn-outline-secondary d-flex align-items-center gap-2 position-relative" id="openTeacherInboxModalBtn">
            <span></span> Mensagens
            <span id="teacherInboxBadge" style="display:none; position: absolute; top: -4px; right: -4px; background: #dc3545; color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; font-weight: bold;">0</span>
          </button>
        </div>

      </div>

      <div class="side-column">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white py-2">
            <h5 class="mb-0 fs-6"> Últimos Registros</h5>
          </div>
          <div class="card-body p-0">
            <div id="teacher-routine-history" class="h-100" style="overflow-y: auto;"></div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <div class="modal-overlay" id="teacherMsgModal">
    <div class="modal-box">
      <button class="modal-close" data-close="teacherMsgModal">&times;</button>
      <h4 class="mb-3">✉️ Enviar Recado ao Responsável</h4>
      <form id="teacherMsgForm" class="needs-validation" novalidate>
        <div class="mb-3">
          <label class="form-label fw-bold">Aluno</label>
          <select class="form-select" id="teacherMsgStudent" required>
            <option value="">Escolha um aluno...</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Mensagem</label>
          <textarea class="form-control" id="teacherMessage" rows="5" required placeholder="Escreva seu recado ao responsável..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">Enviar Recado</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="teacherInboxModal">
    <div class="modal-box">
      <button class="modal-close" data-close="teacherInboxModal">&times;</button>
      <h4 class="mb-3">📨 Mensagens</h4>
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" data-teacher-inbox-tab="received">Recebidas</button></li>
        <li class="nav-item"><button class="nav-link" data-teacher-inbox-tab="sent">Enviadas</button></li>
      </ul>
      <div id="teacher-inbox-content" style="max-height: 400px; overflow-y: auto;"></div>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
