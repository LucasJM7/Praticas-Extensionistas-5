<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrecheNow - Painel Professor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2a66b4">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-info shadow-sm">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="#">CRECHENOW</a>
      <div class="d-flex align-items-center">
        <span class="text-white me-3 d-none d-sm-inline" id="teacherInfo">Professor</span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <main class="dashboard-main">
    <div class="dashboard-row">

      <div class="side-column">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white py-2">
            <h5 class="mb-0 fs-6">Minha Turma <span id="teacherClassDisplay" class="badge bg-info text-dark"></span></h5>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive h-100">
              <table class="table table-hover mb-0 align-middle">
                <thead class="table-light sticky-top">
                  <tr><th>Nome</th><th>Hoje</th></tr>
                </thead>
                <tbody id="teacher-students-list"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div class="center-column">

        <div class="btn-group mb-2" role="group">
          <button class="btn btn-outline-info active" id="showTeacherRoutineBtn">Rotina</button>
          <button class="btn btn-outline-info" id="showTeacherAgendaBtn">Agenda</button>
          <button class="btn btn-outline-info" id="showTeacherCardapioBtn">Cardápio</button>
        </div>

        <div id="teacherCenterContent">
          <div class="card shadow-sm border-0 teacher-view" data-view="routine" style="display: flex;">
            <div class="card-header bg-info text-white py-2">
              <h5 class="mb-0 fs-6">Registro de Rotina Diária</h5>
            </div>
            <div class="card-body">
              <form id="teacherRoutineForm" class="needs-validation h-100 d-flex flex-column" novalidate>
                <div class="mb-3">
                  <label class="form-label small fw-bold">Aluno</label>
                  <select class="form-select" id="routineStudentSelect" required>
                    <option value="">Escolha um aluno...</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-bold d-block mb-1">Presença</label>
                  <select class="form-select" id="routineAttendance" required>
                    <option value="">— Selecione —</option>
                    <option value="present">Presente</option>
                    <option value="absent">Falta</option>
                  </select>
                </div>

                <div id="routineQuestionsContainer" class="mb-3 flex-grow-1 d-none">
                  <label class="form-label small fw-bold">Avaliação do Dia</label>
                  <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0">
                      <tbody>
                        <tr><td class="small">Se comportou bem?</td><td><input type="radio" name="q1" value="sim"> Sim <input type="radio" name="q1" value="nao" class="ms-2"> Não</td></tr>
                        <tr><td class="small">Prestou atenção?</td><td><input type="radio" name="q2" value="sim"> Sim <input type="radio" name="q2" value="nao" class="ms-2"> Não</td></tr>
                        <tr><td class="small">Fez os deveres?</td><td><input type="radio" name="q3" value="sim"> Sim <input type="radio" name="q3" value="nao" class="ms-2"> Não</td></tr>
                        <tr><td class="small">Se deu bem com colegas?</td><td><input type="radio" name="q4" value="sim"> Sim <input type="radio" name="q4" value="nao" class="ms-2"> Não</td></tr>
                        <tr><td class="small">Comeu toda a comida?</td><td><input type="radio" name="q5" value="sim"> Sim <input type="radio" name="q5" value="nao" class="ms-2"> Não</td></tr>
                      </tbody>
                    </table>
                  </div>
                  <div class="mt-3">
                    <label class="form-label small fw-bold">Comentários (Opcional)</label>
                    <textarea class="form-control" id="routineComment" rows="2" placeholder="Detalhes sobre o dia..."></textarea>
                  </div>
                </div>

                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-info text-white flex-fill">Salvar Rotina</button>
                </div>
              </form>
            </div>
          </div>

          <div class="card shadow-sm border-0 teacher-view" data-view="agenda" style="display: none;">
            <div class="card-header bg-info text-white py-2">
              <h5 class="mb-0 fs-6">Agenda Semanal</h5>
            </div>
            <div class="card-body" id="agenda-list"></div>
          </div>

          <div class="card shadow-sm border-0 teacher-view" data-view="cardapio" style="display: none;">
            <div class="card-header bg-info text-white py-2">
              <h5 class="mb-0 fs-6">Cardápio Semanal</h5>
            </div>
            <div class="card-body" id="cardapio-list"></div>
          </div>
        </div>

        <div class="d-flex gap-2 justify-content-center" style="flex-shrink: 0;">
          <button class="btn btn-primary d-flex align-items-center gap-2" id="openTeacherMsgModalBtn">
            <span>+</span> Enviar Recado
          </button>
          <button class="btn btn-outline-primary d-flex align-items-center gap-2 position-relative" id="openTeacherInboxModalBtn">
            <span>i</span> Mensagens
            <span id="inboxBadge" class="inbox-badge">0</span>
          </button>
        </div>

      </div>

      <div class="side-column">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white py-2">
            <h5 class="mb-0 fs-6">Últimos Registros</h5>
          </div>
          <div class="card-body p-0">
            <div id="teacher-routine-history" class="h-100" style="overflow-y: auto;"></div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <div class="modal-overlay" id="messageFormModal">
    <div class="modal-box">
      <button class="modal-close" data-close="messageFormModal">×</button>
      <h4 class="mb-3">Enviar Recado</h4>
      <div id="messageFormBody"></div>
    </div>
  </div>

  <div class="modal-overlay" id="inboxModal">
    <div class="modal-box">
      <button class="modal-close" data-close="inboxModal">×</button>
      <h4 class="mb-3">Mensagens</h4>
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" data-inbox-tab="received">Recebidas</button></li>
        <li class="nav-item"><button class="nav-link" data-inbox-tab="sent">Enviadas</button></li>
      </ul>
      <div id="inbox-content" style="max-height: 400px; overflow-y: auto;"></div>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('#showTeacherRoutineBtn, #showTeacherAgendaBtn, #showTeacherCardapioBtn');
      if (!btn) return;
      document.querySelectorAll('.teacher-view').forEach(v => v.style.display = 'none');
      document.querySelectorAll('#showTeacherRoutineBtn, #showTeacherAgendaBtn, #showTeacherCardapioBtn')
        .forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const view = btn.id === 'showTeacherRoutineBtn' ? 'routine' : btn.id === 'showTeacherAgendaBtn' ? 'agenda' : 'cardapio';
      document.querySelector(`.teacher-view[data-view="${view}"]`).style.display = 'flex';
    });
  </script>
</body>
</html>
