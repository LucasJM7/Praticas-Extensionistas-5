<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrecheNow - Painel Professor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2a66b4">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-info shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">CRECHENOW</a>
      <div class="d-flex align-items-center">
        <span class="text-white me-3 d-none d-sm-inline" id="teacherInfo">Professor</span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-4">
      <!-- Formulário de Rotina Diária -->
      <div class="col-lg-7">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-info text-white">
            <h5 class="mb-0">📝 Registro de Rotina Diária</h5>
          </div>
          <div class="card-body">
            <form id="teacherRoutineForm" class="needs-validation" novalidate>
              <div class="mb-3">
                <label class="form-label fw-bold">Selecione o Aluno (Turma <span id="teacherClassDisplay"></span>)</label>
                <select class="form-select" id="routineStudentSelect" required>
                  <option value="">Escolha um aluno...</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold d-block">Presença</label>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="routineAttendance" checked>
                  <label class="form-check-label" for="routineAttendance">Presente hoje</label>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Avaliação do Dia</label>
                <div class="table-responsive">
                  <table class="table table-sm align-middle">
                    <tbody>
                      <tr><td>Se comportou bem?</td><td><input type="radio" name="q1" value="sim" required> Sim <input type="radio" name="q1" value="nao"> Não</td></tr>
                      <tr><td>Prestou atenção na aula?</td><td><input type="radio" name="q2" value="sim" required> Sim <input type="radio" name="q2" value="nao"> Não</td></tr>
                      <tr><td>Fez os deveres sem problemas?</td><td><input type="radio" name="q3" value="sim" required> Sim <input type="radio" name="q3" value="nao"> Não</td></tr>
                      <tr><td>Se deu bem com os colegas?</td><td><input type="radio" name="q4" value="sim" required> Sim <input type="radio" name="q4" value="nao"> Não</td></tr>
                      <tr><td>Comeu toda a comida?</td><td><input type="radio" name="q5" value="sim" required> Sim <input type="radio" name="q5" value="nao"> Não</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>

              <div class="mb-3">
                <label for="routineComment" class="form-label fw-bold">Comentários Adicionais (Opcional)</label>
                <textarea class="form-control" id="routineComment" rows="3" placeholder="Detalhes sobre o dia da criança..."></textarea>
              </div>

              <button type="submit" class="btn btn-info text-white w-100">💾 Salvar Rotina do Dia</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Histórico Recente da Turma -->
      <div class="col-lg-5">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-header bg-white">
            <h5 class="mb-0">📋 Últimos Registros</h5>
          </div>
          <div class="card-body p-0 overflow-auto" style="max-height: 500px;">
            <div id="teacher-routine-history"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
